# ============================================================
# Datasource PostgreSQL
# Le port 5433 est le port hôte mappé vers le conteneur Docker
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5433/ticketdb
spring.datasource.username=ticket_user
spring.datasource.password=ticket_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / Hibernate
# create-drop : recrée le schéma à chaque démarrage (phase de dev)
# Passer à validate ou update en prod
# ============================================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
# Springdoc / Swagger UI
# ============================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ============================================================
# Serveur
# ============================================================
server.port=8080
