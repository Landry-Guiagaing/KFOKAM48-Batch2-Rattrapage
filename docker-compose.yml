services:
  postgres:
    image: postgres:16
    container_name: ticketdb
    environment:
      POSTGRES_DB: ticketdb
      POSTGRES_USER: ticket_user
      POSTGRES_PASSWORD: ticket_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_user -d ticketdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
